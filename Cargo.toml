[package]
name = "rust-gpu-inference-gateway"
version = "0.1.0"
edition = "2021"
authors = ["jacklee-x"]
description = "A Rust-based inference gateway with a C++/CUDA GPU inference core."
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "registry"] }
tracing-opentelemetry = "0.28"
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["http-proto", "reqwest-client"] }
tower = "0.4"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
tonic = "0.12"
prost = "0.13"

[build-dependencies]
tonic-build = "0.12"
